spring:
  application:
    name: api
  jpa:
    hibernate:
      ddl-auto: ${IMIGRATION_DDL_AUTO}
  datasource:
    url: ${IMIGRATION_DATASOURCE_URL}
    username: ${IMIGRATION_DATASOURCE_USERNAME}
    password: ${IMIGRATION_DATASOURCE_PASSWORD}
    hikari:
      schema: ${IMIGRATION_DATASOURCE_SCHEMA}
jwt:
  secret: ${IMIGRATION_JWT_SECRET}